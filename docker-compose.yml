services:

  veritabani:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Europe/Istanbul"]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-multitenant_auth}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SIFRE}
      TZ:                Europe/Istanbul
    volumes:
      - veritabani_verisi:/var/lib/postgresql/data
      - ./psql:/psql:ro
      - ./psql/kurulum.sh:/docker-entrypoint-initdb.d/00_kurulum.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-multitenant_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  uygulama:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      VERITABANI_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_SIFRE}@veritabani:5432/${POSTGRES_DB:-multitenant_auth}
      TZ: Europe/Istanbul
    ports:
      - "8000:8000"
    depends_on:
      veritabani:
        condition: service_healthy

volumes:
  veritabani_verisi: